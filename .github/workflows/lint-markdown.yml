name: Lint Markdown

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-markdown:
    permissions:
      contents: read
    uses: L3DigitalNet/project-standards/.github/workflows/lint-markdown.yml@v5
    with:
      markdownlint: true
      globs: |-
        **/*.md
        !.pytest_cache/**
        !.ruff_cache/**
        !.venv/**
        !node_modules/**
        !docs/reference/pre-migration/**
